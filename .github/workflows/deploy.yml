name: Deploy
# Fastlane lanes now exist (android/fastlane/, ios/fastlane/ — see
# IMPLEMENTATION.md), but this workflow is intentionally fail-closed when
# required release evidence is unavailable. Manual trigger only
# (workflow_dispatch); a skipped deployment must never be reported as success.
on:
  workflow_dispatch: {}

jobs:
  deploy_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
      - name: Check required secrets are configured
        id: check
        run: |
          missing=()
          [ -z "${{ secrets.ENV_PROD }}" ] && missing+=("ENV_PROD")
          [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] && missing+=("ANDROID_KEY_PASSWORD")
          [ -z "${{ secrets.PLAY_STORE_JSON_KEY }}" ] && missing+=("PLAY_STORE_JSON_KEY")
          [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ] && missing+=("GOOGLE_SERVICES_JSON")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Android deploy cannot proceed; missing required repo secret(s): ${missing[*]}"
            {
              echo "## ❌ Android deploy blocked"
              echo "Missing secret(s): ${missing[*]}. See \`IMPLEMENTATION.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      # FB-001 (Sentry EDUZONE-3, "Failed to load FirebaseOptions from
      # resource"): android/app/build.gradle.kts already applies the
      # com.google.gms.google-services plugin conditionally on
      # android/app/google-services.json existing, and FcmService.init()
      # already degrades to a no-op + logged error when Firebase isn't
      # configured. Both of those are the *code-side* half of this fix.
      # The half that was still missing is here: nothing in this workflow
      # ever wrote a real google-services.json into the checkout, so every
      # release built by this pipeline would silently skip the plugin and
      # reproduce the exact same "Failed to load FirebaseOptions from
      # resource" report on every install, forever, with push
      # notifications permanently dead in production. This check does not
      # block the deploy (push notifications are a product gap, not a
      # signing/security one — see IMPLEMENTATION.md, FB-001), but it
      # makes the gap impossible to miss instead of being one skippable
      # line in a Gradle configuration log.
      - name: Check optional Firebase configuration (FB-001)
        if: steps.check.outputs.ready == 'true'
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret is not set. This release build will ship with the com.google.gms.google-services plugin skipped and Firebase Messaging disabled — push notifications will not work for any user on this build. See IMPLEMENTATION.md, FB-001."
            {
              echo "## ⚠️ Firebase not configured for this release (FB-001)"
              echo "\`GOOGLE_SERVICES_JSON\` secret is missing. The build will still succeed, but push notifications will be disabled for every user on this release (FcmService already degrades to a no-op — this is not a crash). See \`IMPLEMENTATION.md\` → FB-001 before shipping a release that is meant to have working push notifications."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Write signing + env config from secrets
        if: steps.check.outputs.ready == 'true'
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$ENV_PROD" > .env.prod
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          {
            echo "storeFile=$(pwd)/android/release.keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          printf '%s' "$PLAY_STORE_JSON_KEY" > android/play-store-key.json
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
      - name: flutter build appbundle --release
        if: steps.check.outputs.ready == 'true'
        run: flutter build appbundle --release --dart-define-from-file=.env.prod
      - name: fastlane android internal
        if: steps.check.outputs.ready == 'true'
        env:
          PLAY_STORE_JSON_KEY_PATH: play-store-key.json
        working-directory: android
        run: |
          gem install bundler:2.5.6 fastlane -N
          fastlane android internal

  deploy_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets are configured
        id: check
        run: |
          missing=()
          [ -z "${{ secrets.ASC_KEY_ID }}" ] && missing+=("ASC_KEY_ID")
          [ -z "${{ secrets.ASC_ISSUER_ID }}" ] && missing+=("ASC_ISSUER_ID")
          [ -z "${{ secrets.ASC_KEY_CONTENT }}" ] && missing+=("ASC_KEY_CONTENT")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::iOS deploy cannot proceed; missing required repo secret(s): ${missing[*]}"
            {
              echo "## ❌ iOS deploy blocked"
              echo "Missing secret(s): ${missing[*]}. See \`IMPLEMENTATION.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      # Deliberately block instead of reporting a green iOS deploy: this
      # repository still has no verified signing/provisioning/archive/export
      # path. The correct state is an explicit deployment blocker, not a
      # skipped-success result.
      - name: Block unverified iOS deployment
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "::error::iOS deployment is not verified: signing, provisioning, archive, and export are not configured in this repository."
          {
            echo "## ❌ iOS deployment remains unverified"
            echo "Configure and verify Apple signing/provisioning plus archive/export before enabling deployment."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
