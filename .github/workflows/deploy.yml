name: Deploy
# Fastlane lanes now exist (android/fastlane/, ios/fastlane/ — see
# IMPLEMENTATION.md) but this whole pipeline is UNVERIFIED end-to-end: no
# CI run of this workflow has ever completed, because none of the secrets
# it depends on exist yet. Every step below either no-ops with a clear
# ::warning:: (missing secret) or genuinely attempts the real thing —
# never a silent fake-success. Manual trigger only (workflow_dispatch),
# same reasoning as before: this must never look like an automatic
# deploy-on-push pipeline until it has actually been run once for real.
on:
  workflow_dispatch: {}

jobs:
  deploy_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Check required secrets are configured
        id: check
        run: |
          missing=()
          [ -z "${{ secrets.ENV_PROD }}" ] && missing+=("ENV_PROD")
          [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] && missing+=("ANDROID_KEY_PASSWORD")
          [ -z "${{ secrets.PLAY_STORE_JSON_KEY }}" ] && missing+=("PLAY_STORE_JSON_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android deploy skipped — missing repo secret(s): ${missing[*]}. See IMPLEMENTATION.md (REL-001, CI-001) for how to provision each one."
            {
              echo "## ⚠️ Android deploy skipped"
              echo "Missing secret(s): ${missing[*]}. See \`IMPLEMENTATION.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Write signing + env config from secrets
        if: steps.check.outputs.ready == 'true'
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          printf '%s' "$ENV_PROD" > .env.prod
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          {
            echo "storeFile=$(pwd)/android/release.keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          printf '%s' "$PLAY_STORE_JSON_KEY" > android/play-store-key.json
      - name: flutter build appbundle --release
        if: steps.check.outputs.ready == 'true'
        run: flutter build appbundle --release --dart-define-from-file=.env.prod
      - name: fastlane android internal
        if: steps.check.outputs.ready == 'true'
        env:
          PLAY_STORE_JSON_KEY_PATH: play-store-key.json
        working-directory: android
        run: |
          gem install bundler:2.5.6 fastlane -N
          fastlane android internal

  deploy_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets are configured
        id: check
        run: |
          missing=()
          [ -z "${{ secrets.ASC_KEY_ID }}" ] && missing+=("ASC_KEY_ID")
          [ -z "${{ secrets.ASC_ISSUER_ID }}" ] && missing+=("ASC_ISSUER_ID")
          [ -z "${{ secrets.ASC_KEY_CONTENT }}" ] && missing+=("ASC_KEY_CONTENT")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS deploy skipped — missing repo secret(s): ${missing[*]}. Also note: this repo has no signing/provisioning-profile setup documented yet at all (see IMPLEMENTATION.md 'Known gaps'), so even with these three secrets present, an actual build/archive/export step is still missing before 'fastlane ios beta' has anything to upload."
            {
              echo "## ⚠️ iOS deploy skipped"
              echo "Missing secret(s): ${missing[*]}, and signing/provisioning is not yet documented — see \`IMPLEMENTATION.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # Deliberately no build/archive/export/fastlane step here yet: doing
      # so would require fabricating signing-certificate and provisioning-
      # profile handling this repo has never had, which is a bigger, more
      # security-sensitive decision than this pass should make silently.
      # `ios/fastlane/Fastfile` exists and is ready to be wired in once
      # that setup is done for real by someone with an Apple Developer
      # account and the actual certificates.
