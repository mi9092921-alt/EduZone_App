name: Update Goldens
on:
  workflow_dispatch:
jobs:
  update-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter test --update-goldens
      - uses: actions/upload-artifact@v7
        with:
          name: updated-goldens
          path: test/**/goldens/*.png