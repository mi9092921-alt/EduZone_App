name: CI
on:
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Generate l10n
        run: flutter gen-l10n
      - name: Analyze code
        run: flutter analyze
      - name: Accessibility Guard
        run: make check-a11y
      - name: Architecture Guard
        run: make check-architecture
      - name: RTL Guard
        run: make check-rtl
      - name: Design Token Guard
        run: make check-design-tokens
      - name: Performance Guard
        run: make check-performance
      - name: Memory Hygiene Guard
        run: make check-memory-hygiene
      - name: Localization Guard
        run: make check-localizations
      - name: Auth Security Guard
        run: make check-auth-security
      - name: Run tests with coverage
        run: flutter test --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false
      - name: Write .env.staging from secret (if configured)
        env:
          ENV_STAGING: ${{ secrets.ENV_STAGING }}
        run: |
          if [ -n "$ENV_STAGING" ]; then
            printf '%s' "$ENV_STAGING" > .env.staging
          fi
      - name: Build APK (Staging)
        run: |
          if [ ! -f .env.staging ]; then
            echo "⚠️ .env.staging not found — APK build skipped. Set the ENV_STAGING repo secret (Settings → Secrets and variables → Actions) to enable this build."
            exit 0
          fi
          flutter build apk --release --dart-define-from-file=.env.staging
        # NOTE: no `continue-on-error` here on purpose. The "secret not
        # configured" case above already exits 0 on its own, so it was
        # never what continue-on-error was protecting. Its only real
        # effect was to let a genuine `flutter build apk` failure (once
        # ENV_STAGING *is* configured) go green — exactly the masked-CI-
        # failure pattern the project instructions forbid. If this build
        # legitimately needs to be non-blocking during a transition
        # period, that should be a documented, deliberate decision here,
        # not a silent side effect.

  dependency_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: dart pub get
      - name: Audit dependencies (OSV-Scanner)
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.3.8 \
            scan --lockfile=pubspec.lock

  integration_test:
    # NOTE: this job (and the harness test it runs) is UNVERIFIED — written
    # in an environment without a Flutter SDK or emulator/device to confirm
    # `flutter test integration_test/` actually passes here as written. The
    # `integration_test` package documents this command as supported for
    # tests that don't need real platform channels (which the current
    # harness-only test doesn't), but if this job fails on its first real
    # run, the likely fix is switching to a device-backed runner (e.g.
    # reactivecircus/android-emulator-runner) rather than the test itself
    # being wrong. Do not remove or paper over a failure here without
    # checking which of the two it actually is.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Generate l10n
        run: flutter gen-l10n
      - name: Run integration tests
        run: flutter test integration_test/