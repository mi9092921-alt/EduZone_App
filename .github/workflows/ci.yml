name: CI
on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
      - name: Validate canonical Supabase SQL layout
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t forbidden_sql < <(find . -type f -name '*.sql' \
            ! -path './supabase/schema/*' \
            ! -path './supabase/_archived_patches/*' \
            -print)
          if ((${#forbidden_sql[@]} > 0)); then
            printf '::error::SQL files outside supabase/schema and supabase/_archived_patches are forbidden.\n'
            printf '%s\n' "${forbidden_sql[@]}"
            exit 1
          fi

          if find supabase/migrations -type f -name '*.sql' -print -quit | grep -q .; then
            echo '::error::supabase/migrations must not contain active SQL migrations; use the canonical schema files.'
            exit 1
          fi

          expected_schema=(
            'supabase/schema/01_extensions.sql'
            'supabase/schema/02_types.sql'
            'supabase/schema/03_tables.sql'
            'supabase/schema/04_constraints.sql'
            'supabase/schema/05_indexes.sql'
            'supabase/schema/06_views.sql'
            'supabase/schema/07_functions.sql'
            'supabase/schema/08_triggers.sql'
            'supabase/schema/09_rls.sql'
            'supabase/schema/10_permissions.sql'
            'supabase/schema/11_seed_reference.sql'
            'supabase/schema/VALIDATION.sql'
            'supabase/schema/README.md'
          )
          mapfile -t actual_schema < <(find supabase/schema -maxdepth 1 -type f -print | sort)
          for expected in "${expected_schema[@]}"; do
            if [[ ! -f "$expected" ]]; then
              echo "::error::Missing canonical schema file: $expected"
              exit 1
            fi
          done
          for actual in "${actual_schema[@]}"; do
            case " ${expected_schema[*]} " in
              *" $actual "*) ;;
              *)
                echo "::error::Unexpected file in supabase/schema: $actual"
                exit 1
                ;;
            esac
          done

      - name: Install dependencies
        run: flutter pub get
      - name: Generate l10n
        run: flutter gen-l10n
      - name: Analyze code
        run: flutter analyze
      - name: Accessibility Guard
        run: make check-a11y
      - name: Architecture Guard
        run: make check-architecture
      - name: Provider Cycle Guard
        run: make check-provider-cycles
      - name: Session-Invalidation Guard
        run: make check-session-invalidation
      - name: RTL Guard
        run: make check-rtl
      - name: Design Token Guard
        run: make check-design-tokens
      - name: Performance Guard
        run: make check-performance
      - name: Memory Hygiene Guard
        run: make check-memory-hygiene
      - name: Localization Guard
        run: make check-localizations
      - name: Auth Security Guard
        run: make check-auth-security
      - name: Logging Security Guard
        run: make check-logging-security
      - name: Config/Secrets Security Guard
        run: make check-config-security
      - name: Dependency Floor Guard
        run: make check-dependency-floor
      - name: Run tests with coverage
        run: flutter test --coverage --exclude-tags golden
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false
      - name: Build APK (Debug smoke)
        run: |
          flutter build apk --debug --dart-define-from-file=.env.example
        # Production signing and production environment validation belong
        # to the explicit deploy/release pipeline. CI must not report a
        # green release-build gate merely because production secrets are absent.


  secret_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
      - name: Install dependencies
        run: dart pub get
      - name: Audit dependencies (OSV-Scanner)
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.3.8 \
            scan --lockfile=pubspec.lock

  integration_test:
    # These tests exercise the real EduZoneApp widget tree, Riverpod state,
    # and GoRouter redirects while replacing only external backend/platform
    # boundaries with deterministic test doubles. `integration_test` requires
    # a target device, so CI provisions an Android emulator rather than
    # attempting to run the suite with no supported device.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
      - name: Install dependencies
        run: flutter pub get
      - name: Generate l10n
        run: flutter gen-l10n
      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          target: google_apis
          force-avd-creation: true
          ram-size: 4096M
          disk-size: 8192M
          disable-spellchecker: true
          # The emulator already boots on the hosted Linux runner, but the
          # action's post-boot animation settings can race the ADB transport
          # and terminate an otherwise healthy emulator with a broken pipe.
          # These integration tests do not require animations to be disabled.
          disable-animations: false
          emulator-boot-timeout: 1200
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot-load
            -no-snapshot-save -noaudio -no-boot-anim -no-metrics
            -camera-back none -camera-front none
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            flutter test integration_test/app_test.dart -d emulator-5554

  golden_test:
    # Golden images are strict regression evidence. They run on the Windows
    # runner used to author the committed baselines instead of weakening the
    # comparator to accommodate Linux rasterization differences.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
      - name: Install dependencies
        run: flutter pub get
      - name: Generate l10n
        run: flutter gen-l10n
      - name: Run strict golden tests
        run: flutter test --tags golden
