name: Integration Tests

# The integration_test/ suite (real widget tree, Riverpod state, and GoRouter
# redirects against an Android emulator) runs in isolation from CI so a slow
# or flaky emulator run cannot turn the main CI workflow red.
#
# Each run costs ~2-3h of runner time under TCG software emulation (GitHub
# hosted runners expose no KVM), so the suite runs nightly plus manual
# dispatch instead of on every push/PR. ci.yml still gates every push with
# analyze, guards, unit tests, and a debug APK smoke build.
on:
  schedule:
    # 01:00 UTC ≈ 03:00/04:00 Cairo — off-peak, finished by the morning.
    - cron: "0 1 * * *"
  workflow_dispatch:

# Nightly (default branch) and manual runs on the same ref supersede each
# other; runs on different refs (rare) stay independent.
concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration_test:
    # These tests exercise the real EduZoneApp widget tree, Riverpod state,
    # and GoRouter redirects while replacing only external backend/platform
    # boundaries with deterministic test doubles. `integration_test` requires
    # a target device, so this workflow provisions an Android emulator rather
    # than attempting to run the suite with no supported device.
    # GitHub-hosted runners expose no KVM (`-accel off`), so the emulator
    # runs under full TCG software emulation: ~13 min boot + ~8 min Gradle +
    # ~8 min APK install locally-observed, tests ~10x slower than hardware.
    # The suite completes in ~2-3h under TCG; 4h bounds a genuine hang
    # without truncating a healthy run (default is 6h of silent hanging).
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
      - name: Install dependencies
        run: flutter pub get
      - name: Generate l10n
        run: flutter gen-l10n
      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          target: google_apis
          force-avd-creation: true
          ram-size: 4096M
          disk-size: 8192M
          disable-spellchecker: true
          # The emulator already boots on the hosted Linux runner, but the
          # action's post-boot animation settings can race the ADB transport
          # and terminate an otherwise healthy emulator with a broken pipe.
          # These integration tests do not require animations to be disabled.
          disable-animations: false
          emulator-boot-timeout: 1200
          # Pin the emulator binary so SDK-image updates cannot silently
          # change the headless ADB/graphics path used by this job.
          emulator-build: 12895296
          # Use the fully software renderer for headless CI. This avoids
          # renderer/ADB instability while the APK is installed and launched.
          emulator-options: >-
            -no-window -gpu software -no-snapshot-load
            -no-snapshot-save -noaudio -no-boot-anim -no-metrics
            -camera-back none -camera-front none
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            flutter test integration_test/app_test.dart -d emulator-5554
